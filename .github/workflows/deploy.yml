name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pagevault-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify production commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run release:check
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run build

  playwright:
    name: Verify browser flows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - name: Install Playwright test dependency
        working-directory: e2e
        run: npm install --no-package-lock

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: e2e
        run: npm test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore

  deploy:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    needs: [verify, playwright]
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write production secrets file
        working-directory: apps/worker
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
          ADMIN_BASE_URL: ${{ secrets.ADMIN_BASE_URL }}
          DEFAULT_URL_EXPIRE_DAYS: ${{ secrets.DEFAULT_URL_EXPIRE_DAYS }}
          DEFAULT_FILE_EXPIRE_DAYS: ${{ secrets.DEFAULT_FILE_EXPIRE_DAYS }}
          MAX_UPLOAD_SIZE_MB: ${{ secrets.MAX_UPLOAD_SIZE_MB }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          set -eu

          required_vars="
          APP_ENV
          PUBLIC_BASE_URL
          ADMIN_BASE_URL
          DEFAULT_URL_EXPIRE_DAYS
          DEFAULT_FILE_EXPIRE_DAYS
          MAX_UPLOAD_SIZE_MB
          ADMIN_EMAIL
          ADMIN_PASSWORD_HASH
          SESSION_SECRET
          "

          for name in $required_vars; do
            if [ -z "${!name}" ]; then
              printf 'Missing GitHub secret: %s\n' "$name" >&2
              exit 1
            fi
          done

          {
            printf 'APP_ENV=%s\n' "$APP_ENV"
            printf 'PUBLIC_BASE_URL=%s\n' "$PUBLIC_BASE_URL"
            printf 'ADMIN_BASE_URL=%s\n' "$ADMIN_BASE_URL"
            printf 'DEFAULT_URL_EXPIRE_DAYS=%s\n' "$DEFAULT_URL_EXPIRE_DAYS"
            printf 'DEFAULT_FILE_EXPIRE_DAYS=%s\n' "$DEFAULT_FILE_EXPIRE_DAYS"
            printf 'MAX_UPLOAD_SIZE_MB=%s\n' "$MAX_UPLOAD_SIZE_MB"
            printf 'ADMIN_EMAIL=%s\n' "$ADMIN_EMAIL"
            printf 'ADMIN_PASSWORD_HASH=%s\n' "$ADMIN_PASSWORD_HASH"
            printf 'SESSION_SECRET=%s\n' "$SESSION_SECRET"
          } > .env.production

          chmod 600 .env.production

      - name: Check D1 migration status
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          workingDirectory: apps/worker
          command: d1 migrations list pagevault-db --remote

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          workingDirectory: apps/worker
          command: d1 migrations apply pagevault-db --remote

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          workingDirectory: apps/worker
          command: deploy --keep-vars --secrets-file .env.production

      - name: Verify production readiness
        env:
          ADMIN_BASE_URL: ${{ secrets.ADMIN_BASE_URL }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
        run: |
          set -eu
          admin_base="${ADMIN_BASE_URL%/}"
          public_base="${PUBLIC_BASE_URL%/}"
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 2 --retry-all-errors \
            "$admin_base/readyz"
          curl --fail --silent --show-error --head \
            --retry 5 --retry-delay 2 --retry-all-errors \
            "$public_base/share-card.png"
