services:
  pagevault:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: pagevault
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - "13080:3000"
    volumes:
      - /data/pagevault:/data/pagevault
    environment:
      APP_ENV: production
      RUNTIME: node
      DB_DRIVER: sqlite
      STORAGE_DRIVER: local
      SQLITE_PATH: /data/pagevault/pagevault.sqlite
      LOCAL_STORAGE_DIR: /data/pagevault/objects
      ADMIN_BASE_URL: https://admin-html.example.com
      PUBLIC_BASE_URL: https://h.example.com
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD_HASH: replace_me
      SESSION_SECRET: replace_me
      DEFAULT_URL_EXPIRE_DAYS: "15"
      DEFAULT_FILE_EXPIRE_DAYS: "30"
      MAX_UPLOAD_SIZE_MB: "10"
      PUBLIC_HTML_CACHE_SECONDS: "3600"
      ACCESS_COUNT_MODE: windowed
      ACCESS_COUNT_FLUSH_SECONDS: "300"
      PORT: "3000"
